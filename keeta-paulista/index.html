<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Corre na Paulista</title>
<style>
  :root { --yel:#ffd100; --ink:#111214; --red:#e5383b; --ok:#2fbf71; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:#000; overflow:hidden; overscroll-behavior:none;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-user-select:none; user-select:none; touch-action:none; }
  #game, #hudcv { position:fixed; inset:0; width:100%; height:100%; display:block; }
  #game { image-rendering:crisp-edges; image-rendering:pixelated; }
  #hudcv { pointer-events:none; }
  /* estilo 8-bit: cantos retos, fonte monoespaçada, sombras duras */
  body, button { font-family:"Courier New",ui-monospace,Menlo,Consolas,monospace; }
  #hud *, #brake, .card, .btn, .tag { border-radius:0 !important; }
  #hc, #tMoney, #mute, .hb { box-shadow:3px 3px 0 #000 !important; backdrop-filter:none; }
  .card { border:3px solid #ffd100 !important; box-shadow:6px 6px 0 #000 !important; }
  .btn, #brake { box-shadow:4px 4px 0 #000; border:2px solid #000 !important; }
  h1, h2, .btn, .tag, #toast { text-transform:uppercase; }
  #probe { position:fixed; left:0; top:0; width:0; height:0; visibility:hidden;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }

  /* HUD superior */
  #hud { position:fixed; left:0; right:0; top:0; display:none; justify-content:space-between; align-items:flex-start; gap:6px;
    padding:calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 8px) 0 calc(env(safe-area-inset-left) + 8px);
    pointer-events:none; color:#fff; }
  #hud.on { display:flex; }
  #hl { display:flex; align-items:center; gap:6px; flex:1 1 0; min-width:0; }
  .av { width:30px; height:30px; border-radius:50%; background:#1c2a3a; border:2px solid #9fb4c8; flex:none;
    display:flex; align-items:center; justify-content:center; font-size:15px; }
  .bars { flex:1; min-width:0; max-width:150px; }
  .hb { position:relative; height:13px; border-radius:4px; background:rgba(10,12,16,.8); border:1px solid rgba(255,255,255,.35); overflow:hidden; }
  .hb + .hb { margin-top:4px; }
  .hb i { position:absolute; left:0; top:0; bottom:0; width:0; }
  .hb.red i { background:linear-gradient(#ff5a5f,#c9272b); }
  .hb.grn i { background:linear-gradient(#5be08f,#1f9d55); }
  .hb span { position:absolute; inset:0; font-size:8.5px; font-weight:800; letter-spacing:.04em; line-height:11px; padding-left:5px;
    text-shadow:0 1px 1px #000; white-space:nowrap; }
  #hc { flex:none; text-align:center; background:rgba(8,14,20,.82); border:1.5px solid rgba(160,230,255,.55); border-radius:8px;
    padding:4px 12px 5px; box-shadow:0 0 12px rgba(80,200,255,.25); }
  #hc small { display:block; font-size:9.5px; letter-spacing:.08em; color:#dfe9f2; }
  #tTime { display:block; font:900 30px/1 "Courier New",ui-monospace,Menlo,monospace; color:#ff3b30; letter-spacing:.04em;
    text-shadow:0 0 8px rgba(255,59,48,.8); font-variant-numeric:tabular-nums; }
  #hc.low #tTime { animation:blink .5s steps(2) infinite; }
  @keyframes blink { 50% { opacity:.35; } }
  #tDist { display:block; font-size:10.5px; letter-spacing:.05em; margin-top:2px; color:#eaf2f8; font-variant-numeric:tabular-nums; }
  #tDest { display:block; font-size:9px; color:#ffd100; max-width:150px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin:1px auto 0; }
  #hr { flex:1 1 0; display:flex; flex-direction:column; align-items:flex-end; gap:5px; min-width:0; }
  #tMoney { background:rgba(10,12,16,.8); border:1px solid rgba(255,255,255,.3); border-radius:7px; padding:4px 8px;
    font-weight:800; font-size:13px; font-variant-numeric:tabular-nums; white-space:nowrap; }
  #mute { pointer-events:auto; background:rgba(10,12,16,.8); border:1px solid rgba(255,255,255,.3); border-radius:7px;
    color:#fff; font-size:15px; width:36px; height:30px; padding:0; }

  /* controles */
  #brake { position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 14px); transform:translateX(-50%);
    width:92px; height:50px; border-radius:14px; border:2px solid rgba(255,255,255,.4);
    background:rgba(229,56,59,.88); color:#fff; font-weight:800; font-size:14px; letter-spacing:.08em;
    display:none; touch-action:none; }
  #brake.on { display:block; }
  #brake.down { background:#ff6b6e; }
  @media (orientation:landscape) {
    #brake { left:auto; transform:none; right:calc(env(safe-area-inset-right) + 12px); bottom:calc(env(safe-area-inset-bottom) + 108px); height:44px; width:100px; }
  }
  .hint { position:fixed; top:50%; font-size:44px; color:#fff; opacity:0; pointer-events:none;
    text-shadow:0 2px 8px rgba(0,0,0,.6); transition:opacity .4s; }
  .hint.on { opacity:.75; }
  #hL { left:14px; } #hR { right:14px; }

  #toast { position:fixed; left:50%; top:32%; transform:translate(-50%,-50%); pointer-events:none;
    font-weight:900; font-size:24px; color:#fff; text-shadow:0 2px 0 #000, 0 0 14px rgba(0,0,0,.7);
    opacity:0; white-space:nowrap; text-align:center; }
  #toast.show { animation:pop 1.1s ease-out forwards; }
  @keyframes pop { 0% { opacity:0; transform:translate(-50%,-30%) scale(.7); } 15% { opacity:1; transform:translate(-50%,-50%) scale(1.08); }
    70% { opacity:1; } 100% { opacity:0; transform:translate(-50%,-90%) scale(1); } }
  #flash { position:fixed; inset:0; background:#e5383b; opacity:0; pointer-events:none; }

  /* telas */
  #ui { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px);
    background:rgba(10,11,14,.72); overflow:auto; touch-action:pan-y; }
  #ui.off { display:none; }
  .card { width:100%; max-width:380px; margin:auto; background:#17181c; color:#f3f3f3; border-radius:22px; padding:22px 20px;
    box-shadow:0 20px 60px rgba(0,0,0,.6); border:1px solid rgba(255,255,255,.08); }
  .tag { display:inline-block; background:var(--yel); color:#111; font-weight:900; font-size:12px;
    padding:4px 10px; border-radius:999px; letter-spacing:.06em; text-transform:uppercase; }
  h1 { margin:12px 0 6px; font-size:34px; line-height:1; letter-spacing:-.02em; }
  h1 em { font-style:normal; color:var(--yel); }
  h2 { margin:12px 0 4px; font-size:24px; line-height:1.1; }
  p { margin:8px 0; font-size:15px; line-height:1.4; color:#c9cbd1; }
  ul.how { list-style:none; padding:0; margin:14px 0; }
  ul.how li { display:flex; gap:10px; align-items:center; font-size:14px; padding:7px 0; color:#dfe1e6;
    border-bottom:1px solid rgba(255,255,255,.07); }
  ul.how li span { font-size:20px; width:28px; text-align:center; flex:none; }
  dl { margin:12px 0; display:grid; grid-template-columns:auto 1fr; gap:6px 12px; font-size:14px; }
  dt { color:#8e919a; } dd { margin:0; text-align:right; font-weight:600; font-variant-numeric:tabular-nums; }
  dd.big { font-size:22px; color:var(--yel); }
  .btn { display:block; width:100%; margin-top:14px; padding:16px; border:0; border-radius:14px; background:var(--yel);
    color:#111; font-size:18px; font-weight:900; letter-spacing:.02em; touch-action:manipulation; }
  .btn:active { transform:scale(.98); filter:brightness(.92); }
  .best { font-size:12px; color:#8e919a; text-align:center; margin-top:12px; }
  @media (max-height:460px) { .card { padding:14px 18px; } h1 { font-size:26px; } ul.how li { padding:4px 0; font-size:13px; } p { font-size:13px; margin:5px 0; } }
</style>
</head>
<body>
<canvas id="game"></canvas>
<canvas id="hudcv"></canvas>
<div id="probe"></div>

<div id="hud">
  <div id="hl">
    <div class="av">🛵</div>
    <div class="bars">
      <div class="hb red"><i id="bFood"></i><span id="tFood">PEDIDO 100%</span></div>
      <div class="hb grn"><i id="bRoute"></i><span id="tRoute">ROTA 0%</span></div>
    </div>
  </div>
  <div id="hc"><small>TEMPO RESTANTE</small><b id="tTime">00:00</b><span id="tDist">DISTÂNCIA: 0,00 km</span><span id="tDest"></span></div>
  <div id="hr"><div id="tMoney">R$ 0,00</div><button id="mute" aria-label="Som">🔊</button></div>
</div>

<div class="hint" id="hL">◀</div>
<div class="hint" id="hR">▶</div>
<button id="brake">FREIO</button>
<div id="toast"></div>
<div id="flash"></div>

<div id="ui"><div class="card" id="card"></div></div>

<script>
(() => {
'use strict';

/* ================= constantes do mundo (1 unidade = 1 cm) ================= */
const SEG = 300;          // comprimento de um segmento de pista (3 m)
const ROAD = 1050;        // meia largura da rua: 3 faixas de 3,5 m por sentido
const DRAW = 140;         // segmentos desenhados (420 m)
const CAMD = 520;         // distância da câmera até a moto
const VMAX = 2778;        // 100 km/h
const V_CALC = 420;       // 15 km/h na calçada
const BRAKE = 1700;
const GEAR_KMH = [0, 22, 42, 62, 82];              // troca de marcha (km/h)
const GEAR_ACC = [640, 540, 450, 350, 250];        // aceleração por marcha (cm/s²)
const CENTRI = 0.065;     // força que joga a moto para fora da curva
const BLOCK = 8;          // segmentos por prédio (24 m)
const BL = 1.43;          // linha de fachada (calçada de 4,5 m)
const FH = 330;           // altura de um andar
const LANES = [1 / 6, 0.5, 5 / 6];          // faixas do sentido do jogador (a da direita é de ônibus)
const LANE_V = [1400, 1100, 700];
const START = 1500;
const BIKE_LEN = 200, P_HW = 38 / ROAD;

const STREETS = ['R. da Consolação','R. Bela Cintra','R. Haddock Lobo','R. Augusta','R. Pe. João Manuel',
  'Al. Min. Rocha Azevedo','R. Peixoto Gomide','Al. Casa Branca','R. Pamplona','Al. Campinas',
  'Al. J. Eugênio de Lima','Av. Brig. Luís Antônio'];
const DESTS = ['Rua Augusta, 1508','Alameda Santos, 1293','Rua Haddock Lobo, 595','Rua Bela Cintra, 986',
  'Rua Pamplona, 145','Alameda Campinas, 463','Rua Peixoto Gomide, 707','Av. Brig. Luís Antônio, 2344',
  'Rua da Consolação, 2302','Al. Joaquim Eugênio de Lima, 680'];
const RESTS = ['Pastel da Dona Cida','Temaki do Zé','Burger do Vão','Açaí Trianon','Marmitex Paulistana',
  'Esfiha Bela Vista','Pizza da Brigadeiro','Coxinha 24h'];
const ITEMS = ['2x pastel de carne + caldo de cana','Combo temaki salmão','X-salada duplo + fritas','Açaí 700 ml com granola',
  'Marmita de feijoada','10 esfihas abertas','Pizza meia calabresa, meia mussarela','Coxinha com catupiry + refri'];
const SHOPS = ['PADARIA','DROGARIA','BANCO','LANCHONETE','MERCADO','FARMÁCIA','AÇAÍ','PASTELARIA','ÓTICA','PAPELARIA',
  'BARBEARIA','LOTÉRICA','RESTAURANTE','CAFÉ','SAPATARIA','HORTIFRUTI'];
const SIGN_COLS = [['#f4efe2','#b3262b'],['#c9272b','#ffffff'],['#f1c21b','#1b2f6b'],['#1d6b45','#ffffff'],['#f4efe2','#1d4f9c'],['#e8762c','#ffffff']];
const AWN = ['#c9302c','#2f8f5b','#2d6fb3','#d98a1f','#7a4b9a'];

const PAL = [
  { name:'Dia', top:'#5aa6e6', bot:'#d6ecf8', haze:'#c2d0d8', overlay:null, night:false, sun:['#fff7c9',0.8,0.06] },
  { name:'Fim de tarde', top:'#33406f', bot:'#f6b26b', haze:'#c99a80', overlay:'rgba(255,120,40,.13)', night:false, sun:['#ffd98a',0.3,0.1] },
  { name:'Noite', top:'#070b1c', bot:'#2a3558', haze:'#2b3350', overlay:'rgba(6,10,40,.42)', night:true, sun:['#e9edf7',0.78,0.05] }
];
const CAR_COLS = ['#c9ccd1','#f4f4f4','#2a2c31','#a3242b','#6d737d','#2c4c7c','#8a8f98','#3a3d44'];
const BLD_COLS = ['#b9b1a2','#c9bfa8','#a7a59d','#d0c2a6','#b59f8a','#9ea5a8','#c7b9a0','#aab0b3','#bfa98f'];
const SHIRTS = ['#e94f37','#3f88c5','#44af69','#f6ae2d','#8e5572','#f2f2f2','#33658a','#d7263d','#222'];
const SKINS = ['#f1c9a5','#d9a57b','#a8724c','#7a4e2d','#5b3a22'];
const CIRCUITS = [
  { name:'Av. Paulista', desc:'retas longas, curvas leves', c:[2, 5], st:[28, 55], cl:[20, 40], low:0.25, alt:false },
  { name:'Rua Augusta', desc:'curvas em S', c:[5, 10], st:[8, 20], cl:[16, 30], low:0.85, alt:true },
  { name:'Rua da Consolação', desc:'curvas longas e rápidas', c:[4, 8], st:[14, 30], cl:[34, 60], low:0.55, alt:false },
  { name:'Alameda Santos', desc:'curvas fechadas', c:[8, 14], st:[12, 26], cl:[10, 20], low:0.6, alt:false },
  { name:'Av. Brig. Luís Antônio', desc:'curvas fortes em sequência', c:[7, 12], st:[6, 16], cl:[18, 34], low:0.7, alt:true }
];
const MAPC = ['#cfe3b4','#f2c7c0','#f6dfae','#c9daf0','#e3d3ee'];

/* ================= canvas / câmera ================= */
const cv = document.getElementById('game'), hcv = document.getElementById('hudcv');
const ctx = cv.getContext('2d', { alpha:false, willReadFrequently:true });
const hx = hcv.getContext('2d');
let rc = ctx;                                  // contexto usado por rr()
let W = 0, H = 0, FW = 0, FHH = 0, PXS = 3, DPR = 1, S = 400, cx = 0, hy = 0, CAMH = 300, U = 1;
let sT = 0, sR = 0, sB = 0, sL = 0;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  FW = window.innerWidth; FHH = window.innerHeight;
  PXS = Math.max(1.4, Math.min(FW, FHH) / 270);          // tamanho de cada "pixelão" na tela
  W = Math.ceil(FW / PXS); H = Math.ceil(FHH / PXS);    // o mundo é desenhado nesta resolução baixa
  cv.width = W; cv.height = H; ctx.setTransform(1, 0, 0, 1, 0, 0);
  hcv.width = Math.round(FW * DPR); hcv.height = Math.round(FHH * DPR); hx.setTransform(DPR, 0, 0, DPR, 0, 0);
  hx.imageSmoothingEnabled = false;
  const land = W > H;
  const ppc = Math.min(W / 660, H / 395);              // px por cm na distância da moto
  hy = H * (land ? 0.18 : 0.28);
  CAMH = Math.max(250, Math.min(620, ((land ? 0.84 : 0.74) * H - hy) / ppc));
  S = ppc * CAMD; cx = W / 2;
  U = Math.max(0.82, Math.min(1.3, Math.min(FW, FHH) / 400));
  const cs = getComputedStyle(document.getElementById('probe'));
  sT = parseFloat(cs.paddingTop) || 0; sR = parseFloat(cs.paddingRight) || 0; sB = parseFloat(cs.paddingBottom) || 0; sL = parseFloat(cs.paddingLeft) || 0;
}
// paleta de 8 bits: 6 níveis por canal (216 cores, cabe em 1 byte por pixel) com pontilhado ordenado leve
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v / 16 - 0.47) * 16);
const Q6 = new Uint8ClampedArray(384);
for (let i = 0; i < 384; i++) Q6[i] = Math.round(Math.max(0, Math.min(255, i - 64)) / 51) * 51;
function to8bit() {
  const img = ctx.getImageData(0, 0, W, H), d = img.data;
  for (let y = 0, i = 0; y < H; y++) for (let x = 0; x < W; x++, i += 4) {
    const t = BAYER[(y & 3) * 4 + (x & 3)] + 64;
    d[i] = Q6[(d[i] + t) | 0]; d[i + 1] = Q6[(d[i + 1] + t) | 0]; d[i + 2] = Q6[(d[i + 2] + t) | 0];
  }
  ctx.putImageData(img, 0, 0);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));
resize();

/* ================= utilidades ================= */
const rnd = (a, b) => a + Math.random() * (b - a);
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const brl = v => 'R$ ' + v.toFixed(2).replace('.', ',');
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp(Math.round(((n >> 16) & 255) * f), 0, 255), g = clamp(Math.round(((n >> 8) & 255) * f), 0, 255), b = clamp(Math.round((n & 255) * f), 0, 255);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

/* ================= estado ================= */
let state = 'menu';          // menu | offer | play | result | over
let level = 0, money = 0, delivered = 0;
let order = null, pal = PAL[0];
let nseg = 0, cw = null, curve = null, circuit = CIRCUITS[0], segSprites = null, blocks = [[], []];
let gear = 1, shiftT = 0, skyOff = 0;
const CX = new Float32Array(DRAW + 2);
let cars = [], peds = [], oncoming = [];
let finishZ = 0;
let pos = START, px = 0.5, speed = 0, steer = 0, steerS = 0, braking = false;
let timeLeft = 0, food = 100, hurtCd = 0, shake = 0, bump = 0, tAnim = 0;
let base = 0, camX = 0, camY = 0, camZ = 0, shakeX = 0;
const PX = new Float32Array(DRAW + 2), PY = new Float32Array(DRAW + 2), PW = new Float32Array(DRAW + 2), PS = new Float32Array(DRAW + 2);
const buckets = []; for (let i = 0; i < DRAW; i++) buckets.push([]);
let skyline = [];
const ME = { z:0, t:'me' };
let best = { n:0, m:0 };
try { const b = JSON.parse(localStorage.getItem('correPaulistaBest') || 'null'); if (b && typeof b.n === 'number') best = b; } catch (e) {}

/* ================= geração da fase ================= */
function makeOrder(lv) {
  const dist = 1000;                                     // mesma distância em todas as fases: o prazo é que encolhe
  const avg = Math.min(12.5 * Math.pow(1.07, lv - 1), 19); // velocidade média exigida (m/s)
  const i = (lv - 1) % RESTS.length;
  return { rest: RESTS[i], items: ITEMS[i], dest: DESTS[(lv * 3 + 1) % DESTS.length], dist,
    time: Math.round(dist / avg), pay: 8 + lv * 1.5 };
}
function addSprite(k, o) { if (k >= 0 && k < nseg + 2) (segSprites[k] || (segSprites[k] = [])).push(o); }
function newPed(z, x, vx) {
  return { t:'ped', z, x, vx, shirt: pick(SHIRTS), skin: pick(SKINS), pants: pick(['#2b2d42','#3a3a3a','#4a5568','#1f2937','#5b6b8a']), ph: rnd(0, 6) };
}

function buildLevel(lv) {
  order = makeOrder(lv);
  pal = PAL[(lv - 1) % PAL.length];
  finishZ = START + order.dist * 100;
  const finSeg = Math.ceil(finishZ / SEG);
  nseg = finSeg + DRAW + 30;
  cw = new Uint8Array(nseg + 2);
  segSprites = new Array(nseg + 2);
  circuit = CIRCUITS[(lv - 1) % CIRCUITS.length];
  curve = new Float32Array(nseg + DRAW + 4);
  for (let k = 14, dir = Math.random() < 0.5 ? -1 : 1; k < nseg; ) {
    k += rint(circuit.st[0], circuit.st[1]);
    const len = rint(circuit.cl[0], circuit.cl[1]), c = rnd(circuit.c[0], circuit.c[1]) * dir;
    for (let i = 0; i < len && k + i < nseg; i++) curve[k + i] = c * Math.sin(Math.PI * (i + 0.5) / len);
    k += len; dir = circuit.alt ? -dir : (Math.random() < 0.5 ? -1 : 1);
  }
  cars = []; peds = []; oncoming = [];

  // quarteirões
  const nb = Math.ceil((nseg + 2) / BLOCK);
  blocks = [[], []];
  let nextCross = rint(4, 6), st = rint(0, STREETS.length - 1);
  const maspAt = circuit.name === 'Av. Paulista' ? Math.floor(finSeg / BLOCK * 0.45) : -9;
  for (let b = 0; b < nb; b++) {
    const gap = b === nextCross && Math.abs(b * BLOCK - finSeg) > 12 && b !== maspAt && b !== maspAt + 1;
    for (let s = 0; s < 2; s++) {
      const col = pick(BLD_COLS), low = Math.random() < circuit.low;
      const masp = s === 1 && maspAt >= 2 && (b === maspAt || b === maspAt + 1);
      const bl = { gap, low, h: gap ? 0 : (low ? rint(2, 4) : rint(6, 18)) * FH + 120, col, style:'b',
        glass: !low && Math.random() < 0.45, awn: pick(AWN), shop: pick(SHOPS), sc: pick(SIGN_COLS) };
      if (masp) { bl.style = 'masp'; bl.h = 2400; bl.low = false; bl.first = b === maspAt; bl.last = b === maspAt + 1; }
      blocks[s].push(bl);
      if (!gap && !masp && b > 0) {
        const len = bl.shop.length * 62, zc = (b * BLOCK + BLOCK / 2) * SEG;
        addSprite(Math.floor((zc - len / 2) / SEG), { t:'shop', side:s, z:zc - len / 2, z0: zc - len / 2, z1: zc + len / 2, bl });
      }
    }
    if (gap) {
      const k = b * BLOCK, name = STREETS[st % STREETS.length];
      for (let i = 3; i <= 5; i++) cw[k + i] = 1;
      addSprite(k + 1, { t:'sign', x:1.1, z:(k + 1) * SEG + 100, name });
      st++;
      const np = 2 + Math.min(lv, 5);
      for (let i = 0; i < np; i++) {
        const dir = Math.random() < 0.5 ? -1 : 1;
        peds.push(newPed((k + 3) * SEG + rnd(40, 3 * SEG - 40), rnd(-1.1, 1.1), dir * rnd(110, 170) / ROAD));
      }
      nextCross = b + rint(5, 8);
    } else if (b === nextCross) nextCross++;
  }
  if (maspAt >= 2) addSprite(maspAt * BLOCK + 2, { t:'sign', x:1.1, z:(maspAt * BLOCK + 2) * SEG, name:'MASP', red:true });

  // mobiliário urbano e gente na calçada
  for (let k = 2; k < nseg; k++) {
    const bi = Math.floor(k / BLOCK);
    for (let s = 0; s < 2; s++) {
      const bl = blocks[s][bi], sg = s ? 1 : -1;
      if (!bl || bl.gap) continue;
      if (k % 7 === (s ? 3 : 5) && bl.style !== 'masp') addSprite(k, { t:'tree', x:sg * 1.12, z:k * SEG + 150, r:rnd(0.8, 1.2) });
      if (k % 10 === (s ? 0 : 5)) addSprite(k, { t:'pole', x:sg * 1.05, z:k * SEG + 150, sg });
      const np = Math.random() < 0.55 ? rint(1, 3) : 0;
      for (let i = 0; i < np; i++) addSprite(k, newPed(k * SEG + rnd(0, SEG), sg * rnd(1.09, 1.38), 0));
    }
    if (k % 34 === 12 && !cw[k]) addSprite(k, { t:'bustxt', z:k * SEG + 150 });
    if (Math.random() < 0.22) {
      const pts = []; let dx = 0, dz = 0;
      for (let i = 0, m = rint(4, 7); i < m; i++) { pts.push(dx, dz); dx += rnd(-45, 45); dz += rnd(20, 90); }
      addSprite(k, { t:'crack', x:rnd(-0.95, 0.95), z:k * SEG, pts });
    }
  }

  // buracos
  const holeGap = Math.max(26, 58 - 5 * lv) * 100;
  for (let z = START + 7000; z < finishZ - 2500; z += rnd(holeGap * 0.5, holeGap * 1.5)) {
    const x = (Math.random() < 0.2 ? -1 : 1) * pick(LANES) + rnd(-0.08, 0.08);
    const k = Math.floor(z / SEG);
    if (cw[k]) continue;
    addSprite(k, { t:'hole', x, z, w:rnd(95, 150) });
  }
  // pedestres atravessando fora da faixa
  for (let i = 0; i < Math.max(0, lv - 1) * 2; i++) {
    const dir = Math.random() < 0.5 ? -1 : 1;
    peds.push(newPed(rnd(START + 9000, finishZ - 3000), rnd(-0.9, 0.9), dir * rnd(90, 150) / ROAD));
  }
  // carros e ônibus no sentido do jogador
  const gMin = Math.max(2000, 4200 - 400 * lv), gMax = Math.max(4200, 8800 - 750 * lv);
  for (let l = 0; l < 3; l++) {
    for (let z = START + rnd(4500, 9000); z < finishZ + 4000; z += rnd(gMin, gMax)) {
      const bus = l === 2 && Math.random() < 0.6;
      const taxi = !bus && Math.random() < 0.15;
      cars.push({ t: bus ? 'bus' : 'car', z, zp: z, x: LANES[l] + rnd(-0.025, 0.025), v: LANE_V[l] * rnd(0.97, 1.03),
        hw: (bus ? 128 : 92) / ROAD, len: bus ? 1150 : 430, col: bus ? pick(['#2f5fa8','#8b2f3a','#3d7a52','#c9772b']) : taxi ? '#f4f4f4' : pick(CAR_COLS), taxi });
      if (bus) z += 1500;
    }
  }
  // sentido oposto
  for (let i = 0; i < 12 + Math.min(lv, 6); i++)
    oncoming.push({ t:'on', z: START + 3000 + rnd(0, DRAW * SEG), x: -LANES[i % 3] + rnd(-0.02, 0.02), v: [1250, 1050, 800][i % 3] * rnd(0.95, 1.05),
      hw: 92 / ROAD, len: 430, col: pick(CAR_COLS) });

  addSprite(finSeg, { t:'finish', z: finishZ });

  skyline = [];
  for (let x = 0; x < 1.02; ) { const w = rnd(0.02, 0.06); skyline.push({ x, w, h: rnd(0.02, 0.1) }); x += w; }

  pos = START; px = LANES[1]; speed = 0; steer = 0; steerS = 0; braking = false;
  timeLeft = order.time; food = 100; hurtCd = 0; shake = 0; bump = 0; gear = 1; shiftT = 0;
}

let AC = null, eng = null, engGain = null, muted = false;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    eng = AC.createOscillator(); eng.type = 'sawtooth'; eng.frequency.value = 60;
    const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 520;
    engGain = AC.createGain(); engGain.gain.value = 0;
    eng.connect(f); f.connect(engGain); engGain.connect(AC.destination); eng.start();
  } catch (e) { AC = null; }
}
function beep(freq, dur, type, vol, when) {
  if (!AC || muted) return;
  const t = AC.currentTime + (when || 0), o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'square'; o.frequency.value = freq;
  g.gain.setValueAtTime(vol || 0.08, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + 0.02);
}

  if (!AC || muted) return;
  const n = Math.floor(AC.sampleRate * 0.25), buf = AC.createBuffer(1, n, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
  const s = AC.createBufferSource(), g = AC.createGain(), f = AC.createBiquadFilter();
  f.type = 'lowpass'; f.frequency.value = 900; g.gain.value = vol || 0.3;
  s.buffer = buf; s.connect(f); f.connect(g); g.connect(AC.destination); s.start();
}

/* ================= simulação ================= */
function hurt(dmg, msg, big) {
  if (hurtCd > 0) return;
  food = Math.max(0, food - dmg); hurtCd = 0.9; shake = big ? 1 : 0.55;
  toast(msg + '  −' + dmg + '%', '#ff8a8d'); flash(); thud(big ? 0.4 : 0.22);
  if (navigator.vibrate) { try { navigator.vibrate(big ? 160 : 70); } catch (e) {} }
}
function update(dt) {
  tAnim += dt;
  readInput();
  steerS += (steer - steerS) * Math.min(1, dt * 9);
  hurtCd = Math.max(0, hurtCd - dt);
  shake = Math.max(0, shake - dt * 2.2);
  bump *= Math.pow(0.002, dt);

  const onSide = px > 1.0;
  const vmax = onSide ? V_CALC : VMAX;
  let g = 1; const kmh0 = speed * 0.036;
  for (let i = 1; i < GEAR_KMH.length; i++) if (kmh0 >= GEAR_KMH[i]) g = i + 1;
  if (g > gear) shiftT = 0.14;                           // pequena pausa ao subir de marcha
  gear = g; shiftT = Math.max(0, shiftT - dt);
  if (braking) speed = Math.max(0, speed - BRAKE * dt);
  else if (speed < vmax && shiftT <= 0) speed = Math.min(vmax, speed + GEAR_ACC[gear - 1] * dt);
  if (speed > vmax) speed = Math.max(vmax, speed - 2600 * dt);
  if (onSide && speed > 100) bump = Math.sin(tAnim * 40) * 5;

  px += steerS * dt * 1.05 * (0.3 + 0.7 * Math.min(1, speed / 800));
  const cv0 = curve[Math.floor(pos / SEG)] || 0, sp = speed / VMAX;
  px -= cv0 * CENTRI * sp * sp * dt;                     // curva empurra para fora
  skyOff += cv0 * sp * dt * 6;
  px = clamp(px, -0.96, 1.2);

  const prevFront = pos + BIKE_LEN;
  pos += speed * dt;
  let front = pos + BIKE_LEN;

  // veículos no mesmo sentido
  for (let i = 0; i < cars.length; i++) {
    const c = cars[i];
    c.zp = c.z; c.z += c.v * dt;
    if (c.z + c.len < pos - 200 || c.z > pos + 3000) continue;
    const lim = c.hw + P_HW + 0.006;
    if (Math.abs(px - c.x) < lim && front > c.z - 10 && pos < c.z + c.len) {
      if (prevFront <= c.zp + 60) {                      // batida na traseira
        speed = Math.min(speed, c.v * 0.4);
        pos = c.z - BIKE_LEN - 30; front = pos + BIKE_LEN;
        hurt(18, c.t === 'bus' ? 'Bateu no ônibus!' : 'Bateu no carro!', true);
      } else {                                           // raspou de lado
        px = c.x + (px < c.x ? -lim : lim); speed *= Math.pow(0.5, dt);
        hurt(7, 'Raspou!', false);
      }
    }
  }
  // contramão
  for (let i = 0; i < oncoming.length; i++) {
    const c = oncoming[i]; c.z -= c.v * dt;
    if (c.z + c.len < pos - CAMD - 200) { c.z += DRAW * SEG - 300; continue; }
    if (Math.abs(px - c.x) < c.hw + P_HW + 0.006 && front > c.z && pos < c.z + c.len) {
      speed = 0; hurtCd = 0; hurt(30, 'Batida de frente!', true);
      c.z = pos - c.len - 60;
    }
  }
  // pedestres atravessando
  for (let i = 0; i < peds.length; i++) {
    const p = peds[i];
    p.x += p.vx * dt; if (p.x > 1.3) { p.x = 1.3; p.vx = -p.vx; } else if (p.x < -1.3) { p.x = -1.3; p.vx = -p.vx; }
    if (p.z > prevFront - 40 && p.z <= front + 40 && Math.abs(px - p.x) < 0.07 && hurtCd <= 0) {
      speed = 0; hurt(22, 'Cuidado com o pedestre!', true);
    }
  }
  // buracos e gente na calçada
  const k0 = Math.floor(prevFront / SEG), k1 = Math.floor(front / SEG);
  for (let k = k0; k <= k1; k++) {
    const arr = segSprites[k]; if (!arr) continue;
    for (let j = 0; j < arr.length; j++) {
      const o = arr[j];
      if (o.z <= prevFront || o.z > front) continue;
      if (o.t === 'hole' && !o.hit && Math.abs(px - o.x) < o.w / 2 / ROAD + 0.025) {
        o.hit = true; speed *= 0.5; bump = -26; hurt(9, 'Buraco!', false);
      } else if (o.t === 'ped' && Math.abs(px - o.x) < 0.07 && hurtCd <= 0) {
        speed = 0; hurt(22, 'Cuidado com o pedestre!', true);
      }
    }
  }

  timeLeft -= dt;
  if (engGain) {
    engGain.gain.value = muted ? 0 : 0.035;
    const lo = GEAR_KMH[gear - 1], hi = gear < 5 ? GEAR_KMH[gear] : 100;
    eng.frequency.value = 62 + gear * 9 + clamp((speed * 0.036 - lo) / (hi - lo), 0, 1) * 70;
  }
  if (pos >= finishZ) { timeLeft = Math.max(0, timeLeft); if (engGain) engGain.gain.value = 0; finishDelivery(); return; }
  if (food <= 0) { if (engGain) engGain.gain.value = 0; gameOver('food'); return; }
  if (timeLeft <= 0) { timeLeft = 0; if (engGain) engGain.gain.value = 0; gameOver('time'); return; }
}

/* ================= projeção ================= */
let _x = 0, _y = 0, _s = 0;
function curveOff(z) {             // deslocamento lateral da pista (cm) na distância z, visto da câmera
  const f = z / SEG - base; let i = Math.floor(f);
  if (i < 0) return CX[0]; if (i >= DRAW) return CX[DRAW];
  return CX[i] + (CX[i + 1] - CX[i]) * (f - i);
}
function P(xw, yw, z) {            // mundo (cm) -> tela
  let dz = z - camZ; if (dz < 50) dz = 50;
  _s = S / dz; _x = cx + (xw + curveOff(z) - camX) * _s + shakeX; _y = hy - (yw - camY) * _s;
}
function project() {
  camZ = pos - CAMD; base = Math.floor(camZ / SEG);
  let x = 0, dx = -(camZ / SEG - base) * (curve[Math.max(0, base)] || 0);
  for (let n = 0; n <= DRAW; n++) { CX[n] = x; x += dx; dx += curve[Math.max(0, base + n)] || 0; }
  camX = clamp(px, -0.75, 0.95) * ROAD * 0.92 + curveOff(pos); camY = CAMH + bump * 0.4;
  shakeX = shake > 0 ? (Math.random() - 0.5) * 16 * shake / PXS : 0;
  for (let n = 0; n <= DRAW; n++) {
    let dz = (base + n) * SEG - camZ; if (dz < 50) dz = 50;
    const sc = S / dz;
    PS[n] = sc; PX[n] = cx + (CX[n] - camX) * sc + shakeX; PY[n] = hy + camY * sc; PW[n] = ROAD * sc;
  }
}
function q(x1, y1, w1, x2, y2, w2, a, b, col) {
  ctx.fillStyle = col; ctx.beginPath();
  ctx.moveTo(x1 + a * w1, y1 + 0.6); ctx.lineTo(x1 + b * w1, y1 + 0.6); ctx.lineTo(x2 + b * w2, y2); ctx.lineTo(x2 + a * w2, y2); ctx.fill();
}
function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2); const c = rc; c.beginPath();
  c.moveTo(x + r, y); c.lineTo(x + w - r, y); c.quadraticCurveTo(x + w, y, x + w, y + r);
  c.lineTo(x + w, y + h - r); c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  c.lineTo(x + r, y + h); c.quadraticCurveTo(x, y + h, x, y + h - r);
  c.lineTo(x, y + r); c.quadraticCurveTo(x, y, x + r, y); c.closePath();
}
const offX = x => x < -300 || x > W + 300;

/* ================= cenário ================= */
function drawSky() {

  const Y = '#f5d90a', YD = '#d4b800', K = '#17181b', G = '#10a880', GD = '#0a7f60', PT = '#2b2d33';
  const R = (x, y, w, h, r, c) => { ctx.fillStyle = c; rr(x, y, w, h, r); ctx.fill(); };
  const L = (c, lw, pts) => { ctx.strokeStyle = c; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath(); ctx.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]); ctx.stroke(); };
  const T = (txt, y, font, col, mw) => { ctx.save(); ctx.scale(1, -1); ctx.fillStyle = col; ctx.font = font; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(txt, 0, -y, mw); ctx.restore(); };
  // guidão e retrovisores (à frente do corpo)
  L('#2c2e33', 5, [-45, 121, 45, 121]);
  L('#2c2e33', 3, [-33, 121, -45, 142]); L('#2c2e33', 3, [33, 121, 45, 142]);
  ctx.fillStyle = '#b9c4cc'; ctx.beginPath(); ctx.ellipse(-47, 146, 8, 5, 0, 0, 7); ctx.ellipse(47, 146, 8, 5, 0, 0, 7); ctx.fill();
  // braços estendidos para a frente; só o dorso da luva aparece, fechado na manopla
  L(G, 13, [-22, 141, -36, 132, -40, 124]); L(G, 13, [22, 141, 36, 132, 40, 124]);
  R(-47, 116, 13, 10, 4, K); R(34, 116, 13, 10, 4, K);
  // roda traseira, escapamento, rabeta
  R(-7, 0, 14, 64, 6, '#111214');
  R(17, 26, 13, 16, 5, '#8d9299'); R(19, 29, 9, 10, 4, '#3a3d42');
  R(-19, 44, 38, 16, 5, '#2a2c31');
  R(-17, 56, 34, 26, 7, K);
  R(-10, 62, 20, 9, 3, '#e3262e');
  R(-11, 38, 22, 13, 2, '#ececec');
  T('SP 2026', 44.5, '700 6px system-ui,sans-serif', '#222', 20);
  // pernas (calça escura) e botas
  L(PT, 15, [-13, 86, -29, 60, -27, 30]); L(PT, 15, [13, 86, 29, 60, 27, 30]);
  R(-35, 16, 16, 16, 5, K); R(19, 16, 16, 16, 5, K);
  // tronco (jaqueta verde)
  R(-27, 84, 54, 70, 16, G);
  R(-27, 84, 54, 9, 4, GD);
  // capacete amarelo
  R(-7, 150, 14, 8, 3, K);
  ctx.fillStyle = Y; ctx.beginPath(); ctx.arc(0, 166, 16.5, 0, 7); ctx.fill();
  ctx.fillStyle = K; ctx.fillRect(-2.5, 151, 5, 31);
  ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.beginPath(); ctx.ellipse(-7, 173, 4, 6, 0.5, 0, 7); ctx.fill();
  // bag de entrega: corpo verde, painel amarelo de base curva, faixa refletiva e "keeta" em preto
  R(-26, 88, 52, 56, 6, G);
  ctx.save(); rr(-26, 88, 52, 56, 6); ctx.clip();
  ctx.fillStyle = Y; ctx.fillRect(-23, 109, 46, 27);
  ctx.beginPath(); ctx.ellipse(0, 109, 23, 11, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#c9d2cf'; ctx.fillRect(-26, 138, 52, 3);
  ctx.restore();
  ctx.strokeStyle = GD; ctx.lineWidth = 1.6; rr(-26, 88, 52, 56, 6); ctx.stroke();
  ctx.strokeStyle = K; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(-23, 136.5); ctx.lineTo(23, 136.5); ctx.stroke();
  T('keeta', 119, '900 17px system-ui,sans-serif', '#111', 40);
  ctx.restore();
}

function spriteAt(o) {
  switch (o.t) {
    case 'me': drawRider(); break;
    case 'car': case 'on': drawCar(o); break;
    case 'bus': drawBus(o); break;
    case 'ped': drawPed(o); break;
    case 'hole': drawHole(o); break;
    case 'tree': drawTree(o); break;
    case 'pole': drawPole(o); break;
    case 'sign': drawSign(o); break;
    case 'shop': drawShop(o); break;
    case 'crack': drawCrack(o); break;
    case 'bustxt': drawBusTxt(o); break;
    case 'finish': drawFinish(o); break;
  }
}
function fillBuckets() {
  for (let i = 0; i < DRAW; i++) buckets[i].length = 0;
  const put = o => { const n = Math.floor(o.z / SEG) - base; if (n >= 0 && n < DRAW) buckets[n].push(o); };
  for (let i = 0; i < cars.length; i++) put(cars[i]);
  for (let i = 0; i < peds.length; i++) put(peds[i]);
  for (let i = 0; i < oncoming.length; i++) put(oncoming[i]);
  ME.z = pos; put(ME);
}
const byFar = (a, b) => b.z - a.z;

/* ================= HUD no canvas: minimapa e velocímetro ================= */
const MO = new Float32Array(100);   // deslocamento lateral do traçado em relação à moto, por segmento
function drawMinimap() {
  const r = clamp(Math.min(FW, FHH) * 0.15, 46, 84), mx = 10 + sL + r, my = FHH - 10 - sB - r;
  const k = r / 11000, kx = k * 2.2;           // 1 raio = 110 m; largura da rua ampliada 2,2x para leitura
  const py = my + r * 0.45, Yz = z => py - (z - pos) * k;
  const ks = Math.floor(pos / SEG), k0 = ks - 25, fr = pos / SEG - ks;
  { let x = 0, dx = -fr * (curve[ks] || 0);
    for (let i = ks; i < k0 + 100; i++) { MO[i - k0] = x; x += dx; dx += curve[Math.max(0, i)] || 0; }
    x = 0; dx = fr * (curve[ks] || 0);
    for (let i = ks - 1; i >= k0; i--) { dx += curve[Math.max(0, i)] || 0; x += dx; MO[i - k0] = x; } }
  const Xz = z => { const f = z / SEG - k0, i = clamp(Math.floor(f), 0, 98); return mx + (MO[i] + (MO[i + 1] - MO[i]) * (f - i)) * k; };
  hx.save(); hx.beginPath(); hx.arc(mx, my, r, 0, 7); hx.clip();
  hx.fillStyle = '#e8e2d2'; hx.fillRect(mx - r, my - r, 2 * r, 2 * r);
  const rw = ROAD * kx, sh = SEG * k + 0.6;
  for (let i = Math.max(0, k0); i < k0 + 85; i++) {
    const xc = Xz((i + 0.5) * SEG), y = Yz((i + 1) * SEG), b = Math.floor(i / BLOCK);
    for (let sd = 0; sd < 2; sd++) {
      const bl = blocks[sd][b]; if (!bl) continue;
      if (bl.gap) { hx.fillStyle = '#fbfaf5'; hx.fillRect(mx - r, y, 2 * r, sh); break; }
      if (i % BLOCK === BLOCK - 1) continue;             // vão entre os lotes
      hx.fillStyle = bl.style === 'masp' ? '#e2777c' : MAPC[(b * 3 + sd * 2) % MAPC.length];
      if (sd) hx.fillRect(xc + rw + 2, y, r * 2, sh); else hx.fillRect(xc - rw - 2 - r * 2, y, r * 2, sh);
    }
    hx.fillStyle = '#fbfaf5'; hx.fillRect(xc - rw, y, 2 * rw, sh);
    hx.fillStyle = '#e3b93a'; hx.fillRect(xc - 0.6, y, 1.2, sh);
  }
  // rota até o destino (segue o traçado)
  const zEnd = Math.min(finishZ, pos + 15500);
  hx.strokeStyle = '#2b7de9'; hx.lineWidth = 2.4; hx.lineCap = 'round'; hx.lineJoin = 'round';
  hx.beginPath(); hx.moveTo(mx + px * ROAD * kx, py);
  for (let z = pos + 600; z < zEnd; z += 600) hx.lineTo(Xz(z) + 0.5 * ROAD * kx, Yz(z));
  hx.stroke();
  // buracos, pedestres na pista e veículos
  for (let kk = ks - 10; kk < ks + 58; kk++) {
    const a = segSprites[kk]; if (!a) continue;
    for (let i = 0; i < a.length; i++) if (a[i].t === 'hole' && !a[i].hit) { hx.fillStyle = '#c4551a'; hx.beginPath(); hx.arc(Xz(a[i].z) + a[i].x * ROAD * kx, Yz(a[i].z), 2, 0, 7); hx.fill(); }
  }
  hx.fillStyle = '#7a3fb3';
  for (let i = 0; i < peds.length; i++) { const p = peds[i]; if (p.z > pos - 6000 && p.z < pos + 17000 && Math.abs(p.x) < 1) { hx.beginPath(); hx.arc(Xz(p.z) + p.x * ROAD * kx, Yz(p.z), 1.6, 0, 7); hx.fill(); } }
  const veh = (c, col) => { if (c.z < pos - 6500 || c.z > pos + 17000) return; hx.fillStyle = col; hx.fillRect(Xz(c.z) + c.x * ROAD * kx - 1.6, Yz(c.z + c.len), 3.2, Math.max(4, c.len * k)); };
  for (let i = 0; i < cars.length; i++) veh(cars[i], cars[i].t === 'bus' ? '#2f5fa8' : '#4b4f57');
  for (let i = 0; i < oncoming.length; i++) veh(oncoming[i], '#9a9da3');
  // pino do destino: na posição real quando está no alcance; senão, preso à borda na direção da rota
  let dx = Xz(zEnd) + 0.5 * ROAD * kx, dy = Yz(zEnd);
  const ddx = dx - mx, ddy = dy - my, dd = Math.hypot(ddx, ddy), lim = r - 15;
  if (dd > lim) { dx = mx + ddx / dd * lim; dy = my + ddy / dd * lim; }
  hx.fillStyle = '#ffd100'; hx.strokeStyle = '#111'; hx.lineWidth = 1.2;
  hx.beginPath(); hx.moveTo(dx, dy + 3); hx.lineTo(dx - 6, dy - 6); hx.arc(dx, dy - 9, 7, Math.PI * 0.85, Math.PI * 0.15); hx.closePath(); hx.fill(); hx.stroke();
  hx.fillStyle = '#111'; hx.font = '900 9px system-ui,sans-serif'; hx.textAlign = 'center'; hx.textBaseline = 'middle'; hx.fillText('K', dx, dy - 8.5);
  // jogador
  const ax = mx + px * ROAD * kx;
  hx.fillStyle = '#1f6fe0'; hx.strokeStyle = '#fff'; hx.lineWidth = 1.5;
  hx.beginPath(); hx.moveTo(ax, py - 8); hx.lineTo(ax + 6, py + 6); hx.lineTo(ax, py + 2.5); hx.lineTo(ax - 6, py + 6); hx.closePath(); hx.fill(); hx.stroke();
  hx.restore();
  hx.strokeStyle = '#1d2026'; hx.lineWidth = 4; hx.beginPath(); hx.arc(mx, my, r, 0, 7); hx.stroke();
  hx.strokeStyle = 'rgba(255,255,255,.75)'; hx.lineWidth = 1.2; hx.beginPath(); hx.arc(mx, my, r + 2.4, 0, 7); hx.stroke();
}
function drawSpeedo() {
  rc = hx;
  const w = 128 * U, h = 76 * U, x = FW - 10 - sR - w, y = FHH - 10 - sB - h, kmh = speed * 0.036;
  hx.fillStyle = 'rgba(6,16,11,.9)'; rr(x, y, w, h, 0); hx.fill();
  hx.strokeStyle = '#2fe37a'; hx.lineWidth = 2; hx.shadowColor = '#2fe37a'; hx.shadowBlur = 8; rr(x, y, w, h, 0); hx.stroke(); hx.shadowBlur = 0;
  const N = 20, lit = kmh / 120 * N, sw = (w - 20 * U) / N;
  for (let i = 0; i < N; i++) {
    const t = i / (N - 1), bh = (7 + 9 * t) * U, bx = x + 10 * U + i * sw, by = y + 9 * U + (1 - t) * 9 * U;
    hx.fillStyle = i < lit ? (i >= 16 ? '#ff4d4d' : '#39f08a') : (i >= 16 ? '#3a1515' : '#12301f');
    hx.fillRect(bx, by, sw - 1.5 * U, bh);
  }
  hx.fillStyle = '#39f08a'; hx.textBaseline = 'alphabetic'; hx.textAlign = 'right';
  hx.font = '900 ' + 34 * U + 'px "Courier New",ui-monospace,Menlo,monospace';
  hx.shadowColor = '#39f08a'; hx.shadowBlur = 6; hx.fillText(String(Math.round(kmh)).padStart(2, '0'), x + w * 0.62, y + h - 10 * U); hx.shadowBlur = 0;
  hx.font = '700 ' + 12 * U + 'px system-ui,sans-serif'; hx.textAlign = 'left'; hx.fillStyle = '#b8f7d2';
  hx.fillText('km/h', x + w * 0.66, y + h - 11 * U);
  hx.font = '900 ' + 13 * U + 'px system-ui,sans-serif'; hx.fillStyle = '#ffd100';
  hx.fillText(gear + 'ª', x + w * 0.66, y + h - 27 * U);
  rc = ctx;
}

function render() {
  project();
  drawSky();
  fillBuckets();
  for (let n = DRAW - 1; n >= 0; n--) {
    const k = base + n;
    if (k < 0 || k >= nseg) continue;
    drawRoad(n, k);
    drawWall(n, k, 0); drawWall(n, k, 1);
    drawFront(n, k, 0); drawFront(n, k, 1);
    const st = segSprites[k], b = buckets[n];
    if (st) for (let i = 0; i < st.length; i++) b.push(st[i]);
    if (b.length) { if (b.length > 1) b.sort(byFar); for (let i = 0; i < b.length; i++) spriteAt(b[i]); }
  }
  if (pal.overlay) { ctx.fillStyle = pal.overlay; ctx.fillRect(0, 0, W, H); }
  to8bit();
  hx.clearRect(0, 0, FW, FHH);
  if (state === 'play') { drawMinimap(); drawSpeedo(); }
}

/* ================= loop ================= */
let last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.05) dt = 0.05; if (dt < 0) dt = 0;
  if (state === 'play') { update(dt); updateHud(); }
  else tAnim += dt;
  if (segSprites) render();
  requestAnimationFrame(frame);
}

buildLevel(1);
showMenu();
requestAnimationFrame(frame);

// gancho de teste (sem efeito no jogo)
window.__game = { get s() { return { state, pos, px, speed, timeLeft, food, level, finishZ, money, gear, time: order.time, circuit: circuit.name, curve: curve[Math.floor(pos / SEG)], dist: finishZ - pos }; },
  obst() { const r = [], f = pos + BIKE_LEN;
    cars.forEach(c => { if (c.z + c.len > pos && c.z < f + 4500) r.push({ x:c.x, hw:c.hw, d:c.z - f }); });
    oncoming.forEach(c => { if (c.z + c.len > pos && c.z < f + 9000) r.push({ x:c.x, hw:c.hw, d:(c.z - f) / 3 }); });
    peds.forEach(c => { if (c.z > f && c.z < f + 4500) r.push({ x:c.x, hw:0.05, d:c.z - f }); });
    for (let k = Math.floor(f / SEG); k < Math.floor(f / SEG) + 15; k++) (segSprites[k] || []).forEach(o => { if (o.t === 'hole' && o.z > f) r.push({ x:o.x, hw:o.w / 2 / ROAD, d:o.z - f }); });
    return r; } };
})();
</script>
