<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Corre na Paulista</title>
<style>
  :root { --yel:#ffd100; --ink:#111214; --red:#e5383b; --ok:#2fbf71; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:#000; overflow:hidden; overscroll-behavior:none;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-user-select:none; user-select:none; touch-action:none; }
  #game { position:fixed; inset:0; width:100%; height:100%; display:block; }

  /* HUD */
  #hud { position:fixed; left:0; right:0; top:0; padding:calc(env(safe-area-inset-top) + 8px) 10px 0;
    pointer-events:none; display:none; color:#fff; }
  #hud.on { display:block; }
  .row { display:flex; gap:8px; align-items:stretch; }
  .pill { background:rgba(17,18,20,.78); border-radius:12px; padding:6px 10px; line-height:1.1;
    backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); }
  .pill small { display:block; font-size:10px; letter-spacing:.06em; text-transform:uppercase; opacity:.7; }
  .pill b { font-size:22px; font-variant-numeric:tabular-nums; }
  #pTime.low b { color:#ff5a5f; animation:blink .5s steps(2) infinite; }
  @keyframes blink { 50% { opacity:.45; } }
  #pDest { flex:1; min-width:0; }
  #pDest b { font-size:13px; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bar { height:7px; border-radius:4px; background:rgba(255,255,255,.2); margin-top:5px; overflow:hidden; }
  .bar i { display:block; height:100%; width:0; background:var(--yel); border-radius:4px; }
  #row2 { margin-top:6px; }
  #pFood { flex:1; }
  #pFood .bar i { background:var(--ok); }
  #mute { pointer-events:auto; border:0; color:#fff; font-size:18px; width:44px; }

  /* controles */
  #brake { position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 8px); transform:translateX(-50%);
    width:120px; height:50px; border-radius:14px; border:2px solid rgba(255,255,255,.35);
    background:rgba(229,56,59,.85); color:#fff; font-weight:800; font-size:15px; letter-spacing:.08em;
    display:none; touch-action:none; }
  #brake.on { display:block; }
  #brake.down { background:#ff6b6e; transform:translateX(-50%) scale(.96); }
  @media (orientation:landscape) and (max-height:520px) {
    #brake, #brake.down { left:auto; right:calc(env(safe-area-inset-right) + 14px); transform:none; width:100px; height:44px; }
  }
  .hint { position:fixed; top:56%; font-size:44px; color:#fff; opacity:0; pointer-events:none;
    text-shadow:0 2px 8px rgba(0,0,0,.6); transition:opacity .4s; }
  .hint.on { opacity:.75; }
  #hL { left:14px; } #hR { right:14px; }

  #toast { position:fixed; left:50%; top:30%; transform:translate(-50%,-50%); pointer-events:none;
    font-weight:900; font-size:26px; color:#fff; text-shadow:0 2px 0 #000, 0 0 14px rgba(0,0,0,.7);
    opacity:0; white-space:nowrap; text-align:center; }
  #toast.show { animation:pop 1.1s ease-out forwards; }
  @keyframes pop { 0% { opacity:0; transform:translate(-50%,-30%) scale(.7); } 15% { opacity:1; transform:translate(-50%,-50%) scale(1.08); }
    70% { opacity:1; } 100% { opacity:0; transform:translate(-50%,-90%) scale(1); } }
  #flash { position:fixed; inset:0; background:#e5383b; opacity:0; pointer-events:none; }

  /* telas */
  #ui { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px);
    background:rgba(10,11,14,.72); overflow:auto; touch-action:pan-y; }
  #ui.off { display:none; }
  .card { width:100%; max-width:380px; background:#17181c; color:#f3f3f3; border-radius:22px; padding:22px 20px;
    box-shadow:0 20px 60px rgba(0,0,0,.6); border:1px solid rgba(255,255,255,.08); }
  .tag { display:inline-block; background:var(--yel); color:#111; font-weight:900; font-size:12px;
    padding:4px 10px; border-radius:999px; letter-spacing:.06em; text-transform:uppercase; }
  h1 { margin:12px 0 6px; font-size:34px; line-height:1; letter-spacing:-.02em; }
  h1 em { font-style:normal; color:var(--yel); }
  h2 { margin:12px 0 4px; font-size:24px; line-height:1.1; }
  p { margin:8px 0; font-size:15px; line-height:1.4; color:#c9cbd1; }
  ul.how { list-style:none; padding:0; margin:14px 0; }
  ul.how li { display:flex; gap:10px; align-items:center; font-size:14px; padding:7px 0; color:#dfe1e6;
    border-bottom:1px solid rgba(255,255,255,.07); }
  ul.how li span { font-size:20px; width:28px; text-align:center; flex:none; }
  dl { margin:12px 0; display:grid; grid-template-columns:auto 1fr; gap:6px 12px; font-size:14px; }
  dt { color:#8e919a; } dd { margin:0; text-align:right; font-weight:600; font-variant-numeric:tabular-nums; }
  dd.big { font-size:22px; color:var(--yel); }
  .btn { display:block; width:100%; margin-top:14px; padding:16px; border:0; border-radius:14px; background:var(--yel);
    color:#111; font-size:18px; font-weight:900; letter-spacing:.02em; touch-action:manipulation; }
  .btn:active { transform:scale(.98); filter:brightness(.92); }
  .best { font-size:12px; color:#8e919a; text-align:center; margin-top:12px; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="row">
    <div class="pill" id="pTime"><small>Prazo</small><b id="tTime">0:00</b></div>
    <div class="pill" id="pDest"><small>Entrega</small><b id="tDest">—</b><div class="bar"><i id="bDist"></i></div></div>
    <div class="pill"><small>Ganhos</small><b id="tMoney">R$ 0</b></div>
  </div>
  <div class="row" id="row2">
    <div class="pill" id="pFood"><small>Pedido <span id="tFood">100%</span></small><div class="bar"><i id="bFood"></i></div></div>
    <button class="pill" id="mute" aria-label="Som">🔊</button>
  </div>
</div>

<div class="hint" id="hL">◀</div>
<div class="hint" id="hR">▶</div>
<button id="brake">FREIO</button>
<div id="toast"></div>
<div id="flash"></div>

<div id="ui"><div class="card" id="card"></div></div>

<script>
(() => {
'use strict';

/* ================= constantes do mundo (1 unidade = 1 cm) ================= */
const SEG = 300;          // comprimento de um segmento de pista
const ROAD = 900;         // meia largura da pista (sentido do jogador)
const CAMH = 380;         // altura dos olhos
const DRAW = 140;         // segmentos desenhados
const NEAR = 40;
const VMAX = 1667;        // 60 km/h
const V_CICLO = 1110;     // 40 km/h na ciclovia
const V_CALC = 420;       // 15 km/h na calçada
const ACCEL = 400, BRAKE = 1500;
const BLOCK = 8;          // segmentos por prédio
const OR = 1.45, OL = -3.2;       // linha de fachada direita / esquerda
const FH = 330;           // altura de um andar
const LANES = [-0.4175, -0.0125, 0.3925, 0.7975];  // faixas de carro
const LANE_V = [1050, 900, 760, 520];             // velocidade por faixa
const CICLO_X = -0.81;
const PLAYER_FRONT = 260;

const STREETS = ['R. da Consolação','R. Bela Cintra','R. Haddock Lobo','R. Augusta','R. Pe. João Manuel',
  'Al. Min. Rocha Azevedo','R. Peixoto Gomide','Al. Casa Branca','R. Pamplona','Al. Campinas',
  'Al. J. Eugênio de Lima','Av. Brig. Luís Antônio'];
const DESTS = ['Rua Augusta, 1508','Alameda Santos, 1293','Rua Haddock Lobo, 595','Rua Bela Cintra, 986',
  'Rua Pamplona, 145','Alameda Campinas, 463','Rua Peixoto Gomide, 707','Av. Brig. Luís Antônio, 2344',
  'Rua da Consolação, 2302','Al. Joaquim Eugênio de Lima, 680'];
const RESTS = ['Pastel da Dona Cida','Temaki do Zé','Burger do Vão','Açaí Trianon','Marmitex Paulistana',
  'Esfiha Bela Vista','Pizza da Brigadeiro','Coxinha 24h'];
const ITEMS = ['2x pastel de carne + caldo de cana','Combo temaki salmão','X-salada duplo + fritas','Açaí 700 ml com granola',
  'Marmita de feijoada','10 esfihas abertas','Pizza meia calabresa, meia mussarela','Coxinha com catupiry + refri'];

const PAL = [
  { name:'Dia', top:'#3f8fe0', bot:'#d6ecf8', haze:'#c5d6e0', overlay:null, night:false, sun:['#fff7c9',0.72,0.16] },
  { name:'Fim de tarde', top:'#33406f', bot:'#f6b26b', haze:'#d9a88a', overlay:'rgba(255,120,40,.13)', night:false, sun:['#ffd98a',0.3,0.33] },
  { name:'Noite', top:'#070b1c', bot:'#2a3558', haze:'#2b3350', overlay:'rgba(6,10,40,.42)', night:true, sun:['#e9edf7',0.75,0.12] }
];
const CAR_COLS = ['#c9ccd1','#f4f4f4','#2a2c31','#a3242b','#6d737d','#2c4c7c','#8a8f98','#3a3d44'];
const BLD_COLS = ['#8f969e','#a9a499','#7f8791','#b7ada0','#6e7885','#9aa3a8','#c2b9a6','#7b7f86','#5f6b78'];
const SHIRTS = ['#e94f37','#3f88c5','#44af69','#f6ae2d','#8e5572','#f2f2f2','#33658a','#d7263d','#222'];
const SKINS = ['#f1c9a5','#d9a57b','#a8724c','#7a4e2d','#5b3a22'];

/* ================= canvas ================= */
const cv = document.getElementById('game');
const ctx = cv.getContext('2d', { alpha:false });
let W = 0, H = 0, DPR = 1, S = 400, cx = 0, hy = 0;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  S = 0.55 * Math.max(H, W * 0.75);
  cx = W / 2; hy = H * 0.40;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));
resize();

/* ================= utilidades ================= */
const rnd = (a, b) => a + Math.random() * (b - a);
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const brl = v => 'R$ ' + v.toFixed(2).replace('.', ',');
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp(Math.round(((n >> 16) & 255) * f), 0, 255), g = clamp(Math.round(((n >> 8) & 255) * f), 0, 255), b = clamp(Math.round((n & 255) * f), 0, 255);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

/* ================= estado ================= */
let state = 'menu';          // menu | offer | play | result | over
let level = 0, money = 0, delivered = 0;
let order = null, pal = PAL[0];
let nseg = 0, ys = null, cw = null, segSprites = null, blocks = [[], []];
let cars = [], peds = [], oncoming = [];
let finishZ = 0;
let pos = 0, px = 0.19, speed = 0, steer = 0, steerS = 0, braking = false;
let timeLeft = 0, food = 100, hurtCd = 0, shake = 0, bump = 0, tAnim = 0;
let base = 0, camX = 0, camY = 0, shakeX = 0;
const PX = new Float32Array(DRAW + 2), PY = new Float32Array(DRAW + 2), PW = new Float32Array(DRAW + 2), PS = new Float32Array(DRAW + 2);
const buckets = []; for (let i = 0; i < DRAW; i++) buckets.push([]);
let skyline = [];
let best = { n:0, m:0 };
try { const b = JSON.parse(localStorage.getItem('correPaulistaBest') || 'null'); if (b && typeof b.n === 'number') best = b; } catch (e) {}

function yAt(z) {
  const f = z / SEG, i = Math.floor(f);
  if (i < 0) return ys[0];
  if (i >= nseg) return ys[nseg];
  return ys[i] + (ys[i + 1] - ys[i]) * (f - i);
}

/* ================= geração da fase ================= */
function makeOrder(lv) {
  const dist = Math.min(750 + 150 * lv, 1650);
  const avg = Math.min(10.5 + 0.5 * lv, 14);         // m/s exigidos em média
  const i = (lv - 1) % RESTS.length;
  return { rest: RESTS[i], items: ITEMS[i], dest: DESTS[(lv * 3 + 1) % DESTS.length], dist,
    time: Math.ceil(dist / avg) + 6, pay: 6 + dist / 180 };
}

function addSprite(k, o) { (segSprites[k] || (segSprites[k] = [])).push(o); }

function buildLevel(lv) {
  order = makeOrder(lv);
  pal = PAL[(lv - 1) % PAL.length];
  finishZ = order.dist * 100;
  const finSeg = Math.ceil(finishZ / SEG);
  nseg = finSeg + DRAW + 30;
  ys = new Float32Array(nseg + 2);
  const ph = rnd(0, 6);
  for (let i = 0; i <= nseg + 1; i++) ys[i] = 190 * Math.sin(i / 46 + ph) + 70 * Math.sin(i / 19 + ph * 2);
  cw = new Uint8Array(nseg + 2);
  segSprites = new Array(nseg + 2);
  cars = []; peds = []; oncoming = [];

  // quarteirões
  const nb = Math.ceil((nseg + 2) / BLOCK);
  blocks = [[], []];
  let nextCross = rint(4, 6), st = rint(0, STREETS.length - 1);
  const maspAt = Math.floor(finSeg / BLOCK * 0.45);
  for (let b = 0; b < nb; b++) {
    const gap = b === nextCross && Math.abs(b * BLOCK - finSeg) > 12 && b !== maspAt && b !== maspAt + 1;
    for (let s = 0; s < 2; s++) {
      const col = pick(BLD_COLS);
      blocks[s].push({ gap, h: gap ? 0 : rint(5, 22) * FH + 120, col, col2: shade(col, 0.78),
        style: 'b', ant: Math.random() < 0.22, glass: Math.random() < 0.35 });
    }
    if (gap) {
      const k = b * BLOCK;
      for (let i = 3; i <= 5; i++) cw[k + i] = 1;
      addSprite(k + 1, { t:'sign', x:1.12, z:(k + 1) * SEG + 100, name: STREETS[st % STREETS.length] });
      st++;
      const np = 2 + Math.min(lv, 5);
      for (let i = 0; i < np; i++) {
        const dir = Math.random() < 0.5 ? -1 : 1;
        peds.push(newPed((k + 3) * SEG + rnd(40, 3 * SEG - 40), rnd(-0.95, 1.2), dir * rnd(110, 170) / ROAD));
      }
      nextCross = b + rint(5, 8);
    } else if (b === nextCross) nextCross++;
  }
  // MASP (lado direito, dois quarteirões)
  for (let b = maspAt; b <= maspAt + 1 && b < nb; b++) {
    if (b < 2) continue;
    const m = blocks[1][b]; m.gap = false; m.style = 'masp'; m.h = 2400; m.ant = false;
    m.first = b === maspAt; m.last = b === maspAt + 1;
  }
  if (maspAt >= 2) addSprite(maspAt * BLOCK + 2, { t:'sign', x:1.12, z:(maspAt * BLOCK + 2) * SEG, name:'MASP', red:true });

  // mobiliário urbano
  for (let k = 4; k < nseg; k++) {
    const bl = blocks[1][Math.floor(k / BLOCK)];
    if (k % 4 === 2 && bl && !bl.gap && bl.style !== 'masp') addSprite(k, { t:'tree', x:1.22, z:k * SEG + 150, r:rnd(0.8, 1.25) });
    if (k % 9 === 0) addSprite(k, { t:'pole', x:-1.06, z:k * SEG + 150 });
    if (k % BLOCK === 4 && blocks[0][Math.floor(k / BLOCK)].ant) addSprite(k, { t:'ant', side:0, z:k * SEG, h:blocks[0][Math.floor(k / BLOCK)].h });
    if (k % BLOCK === 4 && bl && bl.ant && bl.style === 'b') addSprite(k, { t:'ant', side:1, z:k * SEG, h:bl.h });
  }
  // pedestres na calçada
  for (let z = 3000; z < finishZ + 6000; z += rnd(900, 2600))
    peds.push(newPed(z, rnd(1.16, 1.4), 0));

  // buracos
  const holeGap = Math.max(26, 58 - 5 * lv) * 100;
  for (let z = 7000; z < finishZ - 2500; z += rnd(holeGap * 0.5, holeGap * 1.5)) {
    const inCiclo = Math.random() < 0.15;
    const x = inCiclo ? CICLO_X + rnd(-0.08, 0.08) : pick(LANES) + rnd(-0.1, 0.1);
    const k = Math.floor(z / SEG);
    if (cw[k]) continue;
    addSprite(k, { t:'hole', x, z, w:rnd(95, 150) });
  }
  // pedestres atravessando fora da faixa
  for (let i = 0; i < Math.max(0, lv - 1) * 2; i++) {
    const dir = Math.random() < 0.5 ? -1 : 1;
    peds.push(newPed(rnd(9000, finishZ - 3000), rnd(-0.9, 0.9), dir * rnd(90, 150) / ROAD));
  }
  // carros e ônibus
  const gMin = Math.max(2200, 4600 - 420 * lv), gMax = Math.max(4500, 9500 - 800 * lv);
  for (let l = 0; l < 4; l++) {
    for (let z = rnd(4500, 9000); z < finishZ + 4000; z += rnd(gMin, gMax)) {
      const bus = l === 3 && Math.random() < 0.6;
      const taxi = !bus && Math.random() < 0.15;
      cars.push({ t: bus ? 'bus' : 'car', z, zp: z, x: LANES[l] + rnd(-0.03, 0.03), v: LANE_V[l] * rnd(0.97, 1.03),
        hw: bus ? 0.145 : 0.105, len: bus ? 1200 : 430, col: bus ? pick(['#2f5fa8','#8b2f3a','#3d7a52','#c9772b']) : taxi ? '#f4f4f4' : pick(CAR_COLS), taxi });
      if (bus) z += 1500;
    }
  }
  // ciclistas
  for (let z = rnd(6000, 12000); z < finishZ + 2000; z += rnd(7000, 16000))
    cars.push({ t:'bike', z, zp:z, x: CICLO_X + rnd(-0.09, 0.09), v: rnd(380, 480), hw: 0.04, len: 180, col: pick(SHIRTS) });
  // sentido oposto (só cenário)
  for (let i = 0; i < 9; i++)
    oncoming.push({ z: rnd(0, DRAW * SEG), x: pick([-1.48, -2.02, -2.56]), v: rnd(900, 1400), col: pick(CAR_COLS) });

  addSprite(finSeg, { t:'finish', z: finishZ });

  skyline = [];
  for (let x = 0; x < 1.02; ) { const w = rnd(0.03, 0.08); skyline.push({ x, w, h: rnd(0.03, 0.13) }); x += w; }

  pos = 0; px = LANES[1]; speed = 0; steer = 0; steerS = 0; braking = false;
  timeLeft = order.time; food = 100; hurtCd = 0; shake = 0; bump = 0;
}
function newPed(z, x, vx) {
  return { z, x, vx, shirt: pick(SHIRTS), skin: pick(SKINS), pants: pick(['#2b2d42','#3a3a3a','#4a5568','#1f2937']), ph: rnd(0, 6) };
}

/* ================= áudio ================= */
let AC = null, eng = null, engGain = null, muted = false;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    eng = AC.createOscillator(); eng.type = 'sawtooth'; eng.frequency.value = 60;
    const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 520;
    engGain = AC.createGain(); engGain.gain.value = 0;
    eng.connect(f); f.connect(engGain); engGain.connect(AC.destination); eng.start();
  } catch (e) { AC = null; }
}
function beep(freq, dur, type, vol, when) {
  if (!AC || muted) return;
  const t = AC.currentTime + (when || 0), o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'square'; o.frequency.value = freq;
  g.gain.setValueAtTime(vol || 0.08, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + 0.02);
}
function thud(vol) {
  if (!AC || muted) return;
  const n = Math.floor(AC.sampleRate * 0.25), buf = AC.createBuffer(1, n, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
  const s = AC.createBufferSource(), g = AC.createGain(), f = AC.createBiquadFilter();
  f.type = 'lowpass'; f.frequency.value = 900; g.gain.value = vol || 0.3;
  s.buffer = buf; s.connect(f); f.connect(g); g.connect(AC.destination); s.start();
}

/* ================= HUD / telas ================= */
const $ = id => document.getElementById(id);
const hud = $('hud'), ui = $('ui'), card = $('card'), brakeBtn = $('brake'), toastEl = $('toast'), flashEl = $('flash');
function toast(msg, color) {
  toastEl.textContent = msg; toastEl.style.color = color || '#fff';
  toastEl.classList.remove('show'); void toastEl.offsetWidth; toastEl.classList.add('show');
}
function flash() {
  flashEl.style.transition = 'none'; flashEl.style.opacity = '.38'; void flashEl.offsetWidth;
  flashEl.style.transition = 'opacity .45s'; flashEl.style.opacity = '0';
}
function show(html, onGo) {
  card.innerHTML = html; ui.classList.remove('off'); ui.scrollTop = 0;
  hud.classList.remove('on'); brakeBtn.classList.remove('on');
  const b = card.querySelector('.btn');
  if (b) b.addEventListener('click', () => { initAudio(); beep(660, 0.08, 'square', 0.06); onGo(); }, { once:true });
}
function bestLine() {
  return best.n ? '<div class="best">Recorde: ' + best.n + ' entrega' + (best.n > 1 ? 's' : '') + ' · ' + brl(best.m) + '</div>' : '';
}
function showMenu() {
  state = 'menu';
  show('<span class="tag">Entregador Keeta</span>' +
    '<h1>Corre na <em>Paulista</em></h1>' +
    '<p>Você faz entregas de moto na região da Avenida Paulista. Chegue ao cliente antes do prazo acabar, com o pedido inteiro.</p>' +

/* ================= simulação ================= */
function hurt(dmg, msg, big) {

  food = Math.max(0, food - dmg); hurtCd = 0.9; shake = big ? 1 : 0.55;
  toast(msg + '  −' + dmg + '%', '#ff8a8d'); flash(); thud(big ? 0.4 : 0.22);
  if (navigator.vibrate) { try { navigator.vibrate(big ? 160 : 70); } catch (e) {} }
}
function update(dt) {
  tAnim += dt;
  readInput();
  steerS += (steer - steerS) * Math.min(1, dt * 9);
  hurtCd = Math.max(0, hurtCd - dt);
  shake = Math.max(0, shake - dt * 2.2);
  bump *= Math.pow(0.002, dt);

  const onCiclo = px < -0.62, onSide = px > 1.0;

  else if (speed < vmax) speed = Math.min(vmax, speed + ACCEL * dt);
  if (speed > vmax) speed = Math.max(vmax, speed - (onSide ? 2600 : 900) * dt);
  if (onSide && speed > 100) bump = Math.sin(tAnim * 40) * 5;

  px += steerS * dt * 1.3 * (0.3 + 0.7 * Math.min(1, speed / 800));
  px = clamp(px, -0.96, 1.14);

  const prevFront = pos + PLAYER_FRONT;
  pos += speed * dt;
  let front = pos + PLAYER_FRONT;

  // veículos
  for (let i = 0; i < cars.length; i++) {
    const c = cars[i];
    c.zp = c.z; c.z += c.v * dt;
    if (c.z + c.len < pos - 200 || c.z > pos + 3000) continue;

    if (Math.abs(px - c.x) < lim && front > c.z - 10 && pos + 60 < c.z + c.len) {
      if (prevFront <= c.zp + 60) {                      // batida na traseira
        speed = Math.min(speed, c.v * 0.4);
        pos = c.z - PLAYER_FRONT - 30; front = pos + PLAYER_FRONT;
        hurt(c.t === 'bike' ? 14 : 18, c.t === 'bus' ? 'Bateu no ônibus!' : c.t === 'bike' ? 'Bateu no ciclista!' : 'Bateu no carro!', true);
      } else {                                           // raspou de lado
        px = c.x + (px < c.x ? -lim : lim); speed *= Math.pow(0.5, dt);

    }
  }

      const o = arr[j];

  if (engGain) {

    eng.frequency.value = 48 + speed / VMAX * 120;
  }
  if (pos >= finishZ) { timeLeft = Math.max(0, timeLeft); if (engGain) engGain.gain.value = 0; finishDelivery(); return; }
  if (food <= 0) { if (engGain) engGain.gain.value = 0; gameOver('food'); return; }

}

  if (pal.night && w > 6) {
    ctx.fillStyle = front ? 'rgba(255,240,180,.3)' : 'rgba(255,40,40,.28)';
    ctx.beginPath(); ctx.arc(x - w * 0.38, y - h * 0.5, w * 0.22, 0, 7); ctx.arc(x + w * 0.38, y - h * 0.5, w * 0.22, 0, 7); ctx.fill();
  }
  if (!front) { ctx.fillStyle = '#e9e9e6'; ctx.fillRect(x - w * 0.13, y - h * 0.4, w * 0.26, h * 0.1); }
  if (c.taxi && w > 8) { ctx.fillStyle = '#ffd100'; ctx.fillRect(x - w * 0.1, y - h * 1.08, w * 0.2, h * 0.09); }
}
function drawBus(x, y, s, c) {
  const w = 255 * s, h = 320 * s;
  if (w < 1.2) return;
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(x, y, w * 0.56, Math.max(1, h * 0.04), 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#131416'; ctx.fillRect(x - w * 0.46, y - h * 0.12, w * 0.17, h * 0.12); ctx.fillRect(x + w * 0.29, y - h * 0.12, w * 0.17, h * 0.12);
  ctx.fillStyle = '#d9dcdf'; rr(x - w / 2, y - h, w, h * 0.93, w * 0.07); ctx.fill();
  ctx.fillStyle = c.col; ctx.fillRect(x - w / 2, y - h * 0.5, w, h * 0.3);
  ctx.fillStyle = '#18222c'; rr(x - w * 0.42, y - h * 0.9, w * 0.84, h * 0.34, w * 0.03); ctx.fill();
  ctx.fillStyle = '#2a2c30'; ctx.fillRect(x - w / 2, y - h * 0.16, w, h * 0.09);
  ctx.fillStyle = '#e3262e'; ctx.fillRect(x - w * 0.47, y - h * 0.3, w * 0.12, h * 0.08); ctx.fillRect(x + w * 0.35, y - h * 0.3, w * 0.12, h * 0.08);
  ctx.fillStyle = '#f2b632'; ctx.fillRect(x - w * 0.47, y - h * 0.97, w * 0.94, h * 0.05);
}
function drawPed(x, y, s, p) {
  const h = 172 * s; if (h < 2) return;
  const w = 46 * s, sw = p.vx ? Math.sin(tAnim * 9 + p.ph) : Math.sin(tAnim * 2 + p.ph) * 0.15;
  ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(x, y, w * 0.7, Math.max(1, h * 0.03), 0, 0, 7); ctx.fill();
  ctx.strokeStyle = p.pants; ctx.lineWidth = Math.max(1, 15 * s); ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x - w * 0.18, y - h * 0.47); ctx.lineTo(x - w * 0.18 + sw * w * 0.45, y - 2 * s);
  ctx.moveTo(x + w * 0.18, y - h * 0.47); ctx.lineTo(x + w * 0.18 - sw * w * 0.45, y - 2 * s); ctx.stroke();
  ctx.strokeStyle = p.skin; ctx.lineWidth = Math.max(1, 10 * s);
  ctx.beginPath(); ctx.moveTo(x - w * 0.5, y - h * 0.78); ctx.lineTo(x - w * 0.55 - sw * w * 0.3, y - h * 0.5);
  ctx.moveTo(x + w * 0.5, y - h * 0.78); ctx.lineTo(x + w * 0.55 + sw * w * 0.3, y - h * 0.5); ctx.stroke();
  ctx.fillStyle = p.shirt; rr(x - w / 2, y - h * 0.82, w, h * 0.38, w * 0.25); ctx.fill();
  ctx.fillStyle = p.skin; ctx.beginPath(); ctx.arc(x, y - h * 0.91, h * 0.075, 0, 7); ctx.fill();
  ctx.fillStyle = '#2a1d14'; ctx.beginPath(); ctx.arc(x, y - h * 0.93, h * 0.075, Math.PI, 0); ctx.fill();
}
function drawCyclist(x, y, s, c) {
  const h = 175 * s; if (h < 2) return;
  ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(x, y, 30 * s, Math.max(1, h * 0.025), 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#17181a'; rr(x - 4 * s, y - 70 * s, 8 * s, 70 * s, 3 * s); ctx.fill();
  ctx.strokeStyle = '#2b2d42'; ctx.lineWidth = Math.max(1, 14 * s); ctx.lineCap = 'round';
  const pd = Math.sin(tAnim * 8) * 10 * s;
  ctx.beginPath(); ctx.moveTo(x - 12 * s, y - 95 * s); ctx.lineTo(x - 16 * s, y - 40 * s + pd);
  ctx.moveTo(x + 12 * s, y - 95 * s); ctx.lineTo(x + 16 * s, y - 40 * s - pd); ctx.stroke();
  ctx.fillStyle = c.col; rr(x - 24 * s, y - 150 * s, 48 * s, 62 * s, 12 * s); ctx.fill();
  ctx.fillStyle = '#e8e8e8'; ctx.beginPath(); ctx.arc(x, y - 162 * s, 13 * s, 0, 7); ctx.fill();
}
function drawHole(x, y, s, o, dz) {
  const rx = o.w / 2 * s, ry = Math.max(1.2, 75 * s * CAMH / dz);
  if (rx < 1) return;
  ctx.fillStyle = '#7a6a57'; ctx.beginPath(); ctx.ellipse(x, y, rx * 1.18, ry * 1.3, 0, 0, 7); ctx.fill();
  ctx.fillStyle = o.hit ? '#3a342e' : '#141210'; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, 7); ctx.fill();
  if (rx > 8) { ctx.fillStyle = '#2c2723'; ctx.beginPath(); ctx.ellipse(x - rx * 0.2, y + ry * 0.25, rx * 0.5, ry * 0.4, 0, 0, 7); ctx.fill(); }
}
function drawTree(x, y, s, o) {
  const r = 175 * s * o.r; if (r < 1) return;
  ctx.fillStyle = '#5a4332'; ctx.fillRect(x - 14 * s, y - 330 * s, 28 * s, 330 * s);
  ctx.fillStyle = pal.night ? '#1f3d2a' : '#3f7d47';
  ctx.beginPath(); ctx.arc(x, y - 420 * s, r, 0, 7); ctx.arc(x - r * 0.6, y - 360 * s, r * 0.7, 0, 7); ctx.arc(x + r * 0.6, y - 370 * s, r * 0.7, 0, 7); ctx.fill();
  ctx.fillStyle = pal.night ? '#2a5137' : '#57a05d';
  ctx.beginPath(); ctx.arc(x - r * 0.25, y - 470 * s, r * 0.55, 0, 7); ctx.fill();
}
function drawPole(x, y, s) {
  if (850 * s < 3) return;
  ctx.fillStyle = '#4d5157'; ctx.fillRect(x - 6 * s, y - 850 * s, 12 * s, 850 * s);
  ctx.fillRect(x - 160 * s, y - 850 * s, 320 * s, 9 * s);
  ctx.fillStyle = pal.night ? '#fff3b0' : '#d9dbe0';
  ctx.fillRect(x - 175 * s, y - 846 * s, 60 * s, 16 * s); ctx.fillRect(x + 115 * s, y - 846 * s, 60 * s, 16 * s);
  if (pal.night) {
    ctx.fillStyle = 'rgba(255,240,170,.22)'; ctx.beginPath();
    ctx.arc(x - 145 * s, y - 836 * s, 110 * s, 0, 7); ctx.arc(x + 145 * s, y - 836 * s, 110 * s, 0, 7); ctx.fill();
  }
}
function drawSign(x, y, s, o) {
  const pw = 330 * s, ph = 78 * s; if (pw < 4) return;
  ctx.fillStyle = '#5c6066'; ctx.fillRect(x - 4 * s, y - 330 * s, 8 * s, 330 * s);
  ctx.fillStyle = o.red ? '#c8242b' : '#1d4f9c'; rr(x - pw / 2, y - 330 * s - ph, pw, ph, 8 * s); ctx.fill();
  if (pw > 46) {
    ctx.fillStyle = '#fff'; ctx.font = '700 ' + Math.max(6, 40 * s) + 'px system-ui,sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(o.name, x, y - 330 * s - ph / 2, pw * 0.9);
  }
}
function drawAnt(n, o) {
  const sc = PS[n], xo = (o.side ? OR + 0.9 : OL - 0.9), x = PX[n] + xo * PW[n], y = PY[n] - o.h * sc, h = 2600 * sc;
  if (h < 4) return;
  ctx.globalAlpha = clamp((DRAW - n) / 28, 0, 1);
  ctx.strokeStyle = '#c0392b'; ctx.lineWidth = Math.max(1, 26 * sc);
  ctx.beginPath(); ctx.moveTo(x - 170 * sc, y); ctx.lineTo(x, y - h); ctx.lineTo(x + 170 * sc, y); ctx.stroke();
  ctx.strokeStyle = '#eceff1'; ctx.lineWidth = Math.max(0.6, 14 * sc);
  ctx.beginPath();
  for (let i = 1; i < 6; i++) { const t = i / 6, hw = 170 * sc * (1 - t); ctx.moveTo(x - hw, y - h * t); ctx.lineTo(x + hw, y - h * t); }
  ctx.stroke();
  ctx.fillStyle = '#ff3b30'; ctx.beginPath(); ctx.arc(x, y - h, Math.max(1.2, 28 * sc * (1 + 0.4 * Math.sin(tAnim * 4))), 0, 7); ctx.fill();
  ctx.globalAlpha = 1;
}
function drawFinish(o) {
  const dz = o.z - pos; if (dz < 90) return;
  const sc = S / dz, y = hy - (yAt(o.z) - camY) * sc, xc = cx - camX * sc + shakeX;
  const xl = xc - 0.64 * ROAD * sc, xr = xc + 1.02 * ROAD * sc;
  ctx.fillStyle = 'rgba(255,209,0,.35)'; ctx.fillRect(xl, y - 4 * sc, xr - xl, Math.max(2, 60 * sc * CAMH / dz * 4));
  ctx.fillStyle = '#222'; ctx.fillRect(xl - 12 * sc, y - 640 * sc, 24 * sc, 640 * sc); ctx.fillRect(xr - 12 * sc, y - 640 * sc, 24 * sc, 640 * sc);
  ctx.fillStyle = '#ffd100'; ctx.fillRect(xl, y - 640 * sc, xr - xl, 170 * sc);
  if ((xr - xl) > 50) {
    ctx.fillStyle = '#111'; ctx.font = '900 ' + Math.max(7, 120 * sc) + 'px system-ui,sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('ENTREGA AQUI', (xl + xr) / 2, y - 555 * sc, (xr - xl) * 0.9);
  }
  drawPed(xc + 1.18 * ROAD * sc, y, sc, { vx: 1, ph: 0, shirt: '#ffd100', skin: '#d9a57b', pants: '#2b2d42' });
}

function spriteAt(o, type) {
  const dz = o.z - pos; if (dz < 90) return;
  const sc = S / dz, x = cx + (o.x * ROAD - camX) * sc + shakeX, y = hy - (yAt(o.z) - camY) * sc;
  if (x < -400 || x > W + 400) return;
  switch (type) {
    case 'car': drawCar(x, y, sc, o, false); break;
    case 'bus': drawBus(x, y, sc, o); break;
    case 'bike': drawCyclist(x, y, sc, o); break;
    case 'on': drawCar(x, y, sc, o, true); break;
    case 'ped': drawPed(x, y, sc, o); break;
    case 'hole': drawHole(x, y, sc, o, dz); break;
    case 'tree': drawTree(x, y, sc, o); break;
    case 'pole': drawPole(x, y, sc); break;
    case 'sign': drawSign(x, y, sc, o); break;
  }
}
function fillBuckets() {
  for (let i = 0; i < DRAW; i++) buckets[i].length = 0;
  const put = (o, type) => { const n = Math.floor(o.z / SEG) - base; if (n >= 0 && n < DRAW) buckets[n].push(o, type); };
  for (let i = 0; i < cars.length; i++) put(cars[i], cars[i].t);
  for (let i = 0; i < peds.length; i++) put(peds[i], 'ped');
  for (let i = 0; i < oncoming.length; i++) put(oncoming[i], 'on');
}

function drawBike() {
  const u = Math.min(W, H * 0.62) / 400;
  ctx.save();
  ctx.translate(cx + steerS * 10 * u + shakeX * 0.6, H + Math.max(-8, Math.min(8, -bump * 0.3)));
  ctx.rotate(steerS * 0.055);
  ctx.scale(u, u);
  // mangas
  for (let sg = -1; sg <= 1; sg += 2) {
    ctx.fillStyle = '#ffd100'; ctx.beginPath();
    ctx.moveTo(sg * 148, -66); ctx.lineTo(sg * 196, -100); ctx.lineTo(sg * 300, 40); ctx.lineTo(sg * 185, 40); ctx.fill();
    ctx.fillStyle = '#111'; ctx.beginPath();
    ctx.moveTo(sg * 172, -34); ctx.lineTo(sg * 222, -64); ctx.lineTo(sg * 232, -50); ctx.lineTo(sg * 180, -20); ctx.fill();
  }
  // painel
  ctx.fillStyle = '#17181b'; ctx.beginPath(); ctx.moveTo(-82, 30); ctx.lineTo(-60, -72); ctx.lineTo(60, -72); ctx.lineTo(82, 30); ctx.fill();
  // retrovisores
  ctx.strokeStyle = '#25272b'; ctx.lineWidth = 6; ctx.lineCap = 'round';
  for (let sg = -1; sg <= 1; sg += 2) {
    ctx.beginPath(); ctx.moveTo(sg * 118, -80); ctx.lineTo(sg * 150, -150); ctx.stroke();
    ctx.fillStyle = '#1b1c1f'; rr(sg * 158 - 31, -186, 62, 40, 10); ctx.fill();
    const g = ctx.createLinearGradient(0, -182, 0, -150); g.addColorStop(0, pal.top); g.addColorStop(0.6, pal.bot); g.addColorStop(0.61, '#55575c'); g.addColorStop(1, '#3d3f44');
    ctx.fillStyle = g; rr(sg * 158 - 27, -182, 54, 32, 7); ctx.fill();
  }
  // guidão
  ctx.strokeStyle = '#2c2e33'; ctx.lineWidth = 14;
  ctx.beginPath(); ctx.moveTo(-178, -84); ctx.quadraticCurveTo(0, -62, 178, -84); ctx.stroke();
  ctx.strokeStyle = '#0d0d0e'; ctx.lineWidth = 20;
  ctx.beginPath(); ctx.moveTo(-196, -86); ctx.lineTo(-146, -80); ctx.moveTo(196, -86); ctx.lineTo(146, -80); ctx.stroke();
  // luvas
  for (let sg = -1; sg <= 1; sg += 2) {
    ctx.fillStyle = '#1d1e21'; ctx.beginPath(); ctx.ellipse(sg * 168, -86, 32, 21, sg * 0.12, 0, 7); ctx.fill();
    ctx.strokeStyle = '#34363b'; ctx.lineWidth = 2.5; ctx.beginPath();
    for (let i = 0; i < 3; i++) { ctx.moveTo(sg * (150 + i * 12), -102); ctx.lineTo(sg * (152 + i * 12), -88); }
    ctx.stroke();
  }
  // celular
  ctx.fillStyle = '#25272b'; ctx.fillRect(-7, -90, 14, 26);
  ctx.fillStyle = '#0b0b0d'; rr(-45, -226, 90, 146, 12); ctx.fill();
  ctx.fillStyle = '#fbfbf7'; rr(-40, -221, 80, 136, 8); ctx.fill();
  ctx.fillStyle = '#ffd100'; rr(-40, -221, 80, 26, 8); ctx.fill(); ctx.fillRect(-40, -205, 80, 10);
  ctx.fillStyle = '#111'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '900 15px system-ui,sans-serif'; ctx.fillText('Keeta', 0, -207);
  const left = Math.max(0, Math.ceil((finishZ - pos) / 100));
  ctx.font = '900 12px system-ui,sans-serif'; ctx.fillStyle = '#2fbf71'; ctx.fillText('▲', 0, -183);
  ctx.fillStyle = '#111'; ctx.font = '900 22px system-ui,sans-serif'; ctx.fillText(left + ' m', 0, -163);
  ctx.fillStyle = '#e6e6e0'; ctx.fillRect(-32, -147, 64, 1.5);
  ctx.fillStyle = '#111'; ctx.font = '900 28px system-ui,sans-serif'; ctx.fillText(String(Math.round(speed * 0.036)), 0, -124);
  ctx.fillStyle = '#777'; ctx.font = '700 10px system-ui,sans-serif'; ctx.fillText('km/h', 0, -102);
  ctx.restore();
}

function render() {
  project();
  drawSky();
  fillBuckets();
  for (let n = DRAW - 1; n >= 0; n--) {
    const k = base + n;
    if (k >= nseg) continue;
    drawRoad(n, k);
    drawWall(n, k, 0); drawWall(n, k, 1);
    drawFront(n, k, 0); drawFront(n, k, 1);
    const st = segSprites[k];
    if (st) for (let i = 0; i < st.length; i++) {
      const o = st[i];
      if (o.t === 'ant') drawAnt(n, o); else if (o.t === 'finish') drawFinish(o); else spriteAt(o, o.t);
    }
    const b = buckets[n];
    if (b.length) {
      if (b.length > 2) {             // ordena do mais distante para o mais próximo
        const tmp = []; for (let i = 0; i < b.length; i += 2) tmp.push([b[i], b[i + 1]]);
        tmp.sort((a, c) => c[0].z - a[0].z);
        for (let i = 0; i < tmp.length; i++) spriteAt(tmp[i][0], tmp[i][1]);
      } else spriteAt(b[0], b[1]);
    }
  }
  if (pal.overlay) { ctx.fillStyle = pal.overlay; ctx.fillRect(0, 0, W, H); }
  drawBike();
}

/* ================= loop ================= */
let last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.05) dt = 0.05; if (dt < 0) dt = 0;
  if (state === 'play') { update(dt); updateHud(); }
  else tAnim += dt;
  if (ys) render();
  requestAnimationFrame(frame);
}

buildLevel(1);
showMenu();
requestAnimationFrame(frame);

// gancho de teste (sem efeito no jogo)
window.__game = { get s() { return { state, pos, px, speed, timeLeft, food, level, finishZ, money }; },
  obst() { const r = [], f = pos + PLAYER_FRONT;
    cars.forEach(c => { if (c.z + c.len > pos && c.z < f + 4500) r.push({ x:c.x, hw:c.hw, d:c.z - f }); });
    peds.forEach(c => { if (c.z > f && c.z < f + 4500) r.push({ x:c.x, hw:0.05, d:c.z - f }); });
    for (let k = Math.floor(f / SEG); k < Math.floor(f / SEG) + 15; k++) (segSprites[k] || []).forEach(o => { if (o.t === 'hole' && o.z > f) r.push({ x:o.x, hw:o.w / 2 / ROAD, d:o.z - f }); });
    return r; } };
})();
</script>
